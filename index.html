<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A live digital clock showing the current time in different time zones.">
  <title>WorldTime | Digital Clock</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="./">World<span>Time</span></a>
      <p class="live-status"><span class="status-dot"></span> Live clock</p>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">GLOBAL TIME DASHBOARD</p>
      <h1 id="page-title">Time, wherever you are.</h1>
      <p class="intro">Track the current time across the world's most connected cities.</p>
    </section>

    <section class="clock-grid" id="clock-grid" aria-label="World clocks">
      <!-- Clock cards are rendered by script.js -->
    </section>

    <footer>
      <p>Times update every second · Your device time zone: <strong id="local-zone">detecting…</strong></p>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
